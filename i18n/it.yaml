# Homepage — Philosophy
philosophyLabel: "Filosofia"
philosophyTitle: "Ti seguiamo corpo per corpo"
philosophyText: "Non sei un numero. In ogni classe troviamo il gesto giusto per te, senza fretta."
philosophyCard1Title: "Gruppi piccoli"
philosophyCard1Text: "Da 10 a 12 persone per classe. Abbiamo il tempo di guardarti, correggerti, capire dove sei."
philosophyCard2Title: "Istruttori preparati"
philosophyCard2Text: "Formazione continua, studio del movimento, attenzione a ogni corpo. Non si improvvisa."
philosophyCard3Title: "Attrezzatura completa"
philosophyCard3Text: "Reformer, Cadillac, Chair, Barrel e piccoli attrezzi. Ogni esercizio ha lo strumento giusto."

# Homepage — Approach
approachLabel: "Il nostro metodo"
approachTitle: "Persona prima, esercizio dopo"
approachItem1Title: "Accoglienza"
approachItem1Text: "La prima volta ti accogliamo, ascoltiamo quello che porti, e costruiamo un percorso su di te."
approachItem2Title: "Presenza"
approachItem2Text: "Non lasciamo mai la classe. Ogni movimento ha una guida che vede, aggiusta, incoraggia."
approachItem3Title: "Progresso"
approachItem3Text: "Celebriamo i tuoi miglioramenti, non confrontiamo i corpi. Oggi hai tenuto la posizione più a lungo. Si vede."

